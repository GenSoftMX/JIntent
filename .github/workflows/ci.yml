---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Flutter ${{ matrix.flutter-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.29.2 is the first stable release shipping Dart 3.7.2, the minimum
        # SDK in pubspec.yaml. 3.47.6 is the version used for coverage.
        flutter-version: ['3.29.2', '3.47.6']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        if: matrix.flutter-version == '3.47.6'
        run: |
          # Install lcov tools
          sudo apt-get update
          sudo apt-get install -y lcov

          # Generate coverage report
          genhtml coverage/lcov.info -o coverage/html

          # Extract coverage percentage
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | \
            grep "lines" | awk '{print $2}' | sed 's/%//')

          echo "Coverage: $COVERAGE%"

          # Check if coverage meets threshold (80%)
          THRESHOLD=80
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below threshold $THRESHOLD%"
            exit 1
          else
            echo "✅ Coverage $COVERAGE% meets threshold $THRESHOLD%"
          fi

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Upload coverage artifact
        if: matrix.flutter-version == '3.47.6'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 30

      - name: Upload coverage HTML report
        if: matrix.flutter-version == '3.47.6'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 30
